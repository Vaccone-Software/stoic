name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stress:
        description: "Also run every suite up to 100 times (slow)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: scripts/check.sh
    # macOS 27 with Xcode 27 (GitHub's preview image), the platform floor.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version
          swift --version

      - name: Check
        run: ./scripts/check.sh ${{ inputs.stress && '--stress' || '' }}
